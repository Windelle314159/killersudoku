<meta name="apple-mobile-web-app-title" content="Killer Sudoku">
<meta name="theme-color" content="#0e2678">
<style>
:root{--bg:#eef3fa;--card:#fff;--fg:#000;--sec:#8e8e93;--line:#d1d1d6;--thick:#1c1c1e;--box:rgba(60,60,67,.4);--lab:#b23c85;--cage:#aeaeb2;--dlg:rgba(246,246,248,.76);--fill:rgba(120,120,128,.14);
 --acc:#1776c7;--rgb:23,118,199;--heart:#e859a9;--onacc:#fff;
 --rl:34px;--rm:26px;--rs:14px;--rb:999px;--rt:50%;--bd:none;--blur:36px;--sh:0 4px 16px rgba(0,0,0,.08);--dsh:0 28px 60px rgba(0,0,0,.2);
 --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;--fn:var(--ff);
 --pad:16px;--ctl:48px;--nav:44px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/22px var(--ff);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.scr{display:none;width:var(--w);--w:min(calc(100vw - 2*var(--pad)),460px);padding-bottom:32px}
.scr.on{display:block}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px;stroke-width:2.4;color:var(--sec)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px}
.nav>:first-child{justify-self:start}.nav>:last-child{justify-self:end}
.nav b{font-size:17px;font-weight:600}
.cb,.pill{height:var(--nav);background:var(--card);border:var(--bd);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.cb{width:var(--nav);border-radius:var(--rt)}
.pill{padding:0 18px;border-radius:var(--rb);font:17px/22px var(--fn);font-variant-numeric:tabular-nums}
.hit{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--acc)}
h1{font-size:34px;line-height:41px;font-weight:700;margin:8px 0}
.sub{color:var(--sec);font-size:15px;line-height:20px;margin:0 0 28px}
.cap{color:var(--sec);font-size:13px;line-height:18px;padding:0 var(--pad) 8px}
.grp{background:var(--card);border:var(--bd);border-radius:var(--rm);overflow:hidden;margin-bottom:28px}
.row{display:flex;width:100%;height:var(--ctl);align-items:center;justify-content:space-between;padding:0 var(--pad);text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:var(--pad);right:0;border-top:.5px solid var(--line)}
.row small{color:var(--sec);font-size:15px;display:flex;align-items:center;gap:6px}
.row.acc{color:var(--acc)}
.foot{color:var(--sec);font-size:13px;line-height:18px;padding:0 var(--pad)}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.ttl h1{margin:0}
#hearts{display:flex;gap:6px}
#hearts svg{width:20px;height:20px;fill:var(--heart);stroke:none}
#hearts svg.off{opacity:.22}
#gw{position:relative;background:var(--card);border:1.5px solid var(--box)}
#grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:100%;aspect-ratio:1;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.c{display:flex;align-items:center;justify-content:center;font:calc(var(--w)/9*.56)/1 var(--fn);color:var(--acc);position:relative;cursor:pointer;overflow:hidden;min-width:0}
.c.g{color:var(--fg);font-weight:600}
.c.p{background:rgba(120,120,128,.11)}.c.s{background:rgba(var(--rgb),.14)}.c.sel{background:rgba(var(--rgb),.28)}
.c.bad{animation:sh .4s;color:#ff3b30}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sm{position:absolute;top:calc(var(--w)/9*.11);left:calc(var(--w)/9*.13);font:500 calc(var(--w)/9*.17)/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.3px;color:var(--lab);pointer-events:none}
.nt{position:absolute;inset:24%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font:calc(var(--w)/9*.18) var(--fn);color:var(--sec)}
.nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.tools{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 16px}
.tb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:14px;color:var(--sec);position:relative}
.tb em{font-style:normal}
.tb .ci .i{width:24px;height:24px;stroke-width:1.7}
.tb .ci{width:var(--ctl);height:var(--ctl);border-radius:var(--rt);background:var(--card);border:var(--bd);box-shadow:var(--sh);color:var(--acc);display:flex;align-items:center;justify-content:center}
.tb.on .ci{background:var(--acc);color:var(--onacc)}
.badge{position:absolute;top:-2px;left:calc(50% + 10px);background:var(--acc);color:var(--onacc);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.pad button{background:var(--card);border:var(--bd);border-radius:var(--rs);height:var(--ctl);font:24px/26px var(--fn);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc)}
.pad small{font:10px/11px var(--ff);color:var(--sec)}
.pad button:disabled{opacity:.25}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:9}
.mask.on{display:flex;animation:fd .2s}
@keyframes fd{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#ov{align-items:center;justify-content:center}
#ov .box{background:var(--dlg);border:var(--bd);border-radius:var(--rl);padding:20px 14px 14px;width:min(292px,75vw);box-shadow:var(--dsh);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);backdrop-filter:blur(var(--blur)) saturate(1.5);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
#ov h2{margin:0 14px 4px;font-size:17px;line-height:22px;font-weight:600}
#ov p{margin:0 14px 24px;font-size:17px;line-height:22px;color:var(--sec)}
.act{display:flex;gap:7px}
.act button{flex:1;height:44px;border-radius:var(--rb);background:var(--fill)}
.act button.b{background:var(--acc);color:var(--onacc);font-weight:600}
#sheet{align-items:flex-end;justify-content:center}
#sheet .box{background:var(--bg);width:min(100vw,500px);max-height:90vh;overflow:auto;border-radius:var(--rl) var(--rl) 0 0;padding:8px var(--pad) calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.gb{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto}
.stl,.pal{display:grid;gap:10px;margin-bottom:28px}
.stl{grid-template-columns:repeat(2,1fr)}.pal{grid-template-columns:repeat(3,1fr)}
.stb,.pal button{background:var(--card);border:var(--bd);border-radius:var(--rm);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;line-height:16px;outline:2px solid transparent;outline-offset:-2px}
.stb b{font-size:15px;font-weight:600}.stb small{color:var(--sec);font-size:12px}
.stb.on,.pal button.on{outline-color:var(--acc)}
.pv{width:100%;height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.pv i{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font:600 20px/1 serif;font-style:normal}
.pal button{padding:14px 0 12px;gap:10px}
.dots{display:flex}.dots i{width:14px;height:14px;border-radius:50%;margin-left:-3px;border:1.5px solid var(--card)}.dots i:first-child{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:var(--rb);padding:3px;height:var(--nav);margin-bottom:28px}
.seg button{border-radius:var(--rb);font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
#game .nav{margin-bottom:10px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s}

function showM(el){const b=el.querySelector('.box');if(b)b.style.cssText='';el.style.cssText='';el.classList.remove('out');el.classList.add('on')}

function overlay(){let h='';for(let i=1;i<9;i++){const t=i%3==0;h+=`<path d="M${i*100} 0V900M0 ${i*100}H900" stroke="${t?'var(--box)':'var(--line)'}" stroke-width="${t?3.6:1.2}" fill="none"/>`}
 const Q=9;S.cages.forEach((cl,k)=>{const E=new Map(),cg=S.cg,add=(x0,y0,x1,y1,nx,ny)=>E.set(x0+','+y0,{x0,y0,x1,y1,nx,ny});
  for(const i of cl){const r=i/9|0,c=i%9,s=(a,b)=>a>=0&&a<9&&b>=0&&b<9&&cg[a*9+b]==k;
   if(!s(r-1,c))add(c,r,c+1,r,0,1);if(!s(r,c+1))add(c+1,r,c+1,r+1,-1,0);if(!s(r+1,c))add(c+1,r+1,c,r+1,0,-1);if(!s(r,c-1))add(c,r+1,c,r,1,0)}
  const used=new Set();let d='';
  for(const[key,e0]of E){if(used.has(key))continue;const L=[];let e=e0;while(e&&!used.has(e.x0+','+e.y0)){used.add(e.x0+','+e.y0);L.push(e);e=E.get(e.x1+','+e.y1)}
   L.forEach((b,j)=>{const a=L[(j+L.length-1)%L.length],same=a.nx==b.nx&&a.ny==b.ny,ox=same?b.nx:a.nx+b.nx,oy=same?b.ny:a.ny+b.ny;d+=(j?'L':'M')+(b.x0*100+ox*Q)+' '+(b.y0*100+oy*Q)});d+='Z'}
  h+=`<path d="${d}" fill="none" stroke="var(--cage)" stroke-width="1.4" stroke-dasharray="3 6" stroke-linecap="round" stroke-linejoin="round"/>`});
 $('#gl').innerHTML=h}
function render(){
 if(G._s!==S){G._s=S;overlay()}
 const sv=S.sel>=0?S.cur[S.sel]:0,sr=S.sel/9|0,sc=S.sel%9,cg=S.cg;
 [...G.children].forEach((e,i)=>{const r=i/9|0,c=i%9,v=S.cur[i];let k='c';
  if(S.giv[i])k+=' g';
  if(S.sel>=0){if(i==S.sel)k+=' sel';else if(sv&&v==sv)k+=' s';else if(r==sr||c==sc||(r/3|0)==(sr/3|0)&&(c/3|0)==(sc/3|0))k+=' p'}
  e.className=k;
  const lead=Math.min(...S.cages[cg[i]])==i;
  e.innerHTML=(lead?`<span class="sm">${S.sums[cg[i]]}</span>`:'')+(v?`<span>${v}</span>`:S.notes[i]?'<div class="nt">'+[1,2,3,4,5,6,7,8,9].map(d=>'<i>'+(S.notes[i]&bit(d)?d:'')+'</i>').join('')+'</div>':'')});
 $('#hearts').innerHTML=[0,1,2].map(i=>`<svg class="${i<S.lives?'':'off'}" viewBox="0 0 24 24"><use href="#heart"/></svg>`).join('');
 $('#tm').textContent=fmt(S.t);$('#tm').style.display=PF.tm?'':'none';$('#hc').textContent=S.hints;$('#nt').classList.toggle('on',S.note);
 P9.querySelectorAll('button').forEach(b=>{const d=+b.dataset.d;let n=9;S.cur.forEach(v=>{if(v==d)n--});b.innerHTML=d+'<small>'+n+'</small>';b.disabled=n<=0})}
function snap(){S.hist.push([S.cur.slice(),S.notes.slice()]);if(S.hist.length>60)S.hist.shift()}
function peers(i,d){const r=i/9|0,c=i%9;for(let j=0;j<81;j++){const a=j/9|0,b=j%9;if(a==r||b==c||(a/3|0)==(r/3|0)&&(b/3|0)==(c/3|0))S.notes[j]&=~bit(d)}}
function done(){return S.cur.every((v,i)=>v==S.sol[i])}
function put(d){if(S.over||S.sel<0)return;const i=S.sel;if(S.cur[i])return;
 if(S.note){snap();S.notes[i]^=bit(d)}
 else if(S.sol[i]==d){snap();S.cur[i]=d;S.notes[i]=0;peers(i,d)}
 else{S.lives--;render();{const h=$('#hearts').children[S.lives];h&&h.classList.add('lose')}const e=G.children[i];e.classList.add('bad');e.innerHTML=`<span>${d}</span>`;setTimeout(render,500);if(S.lives<=0)end(0);save();return}
 render();popCell(i);save();if(done())end(1)}
function end(w){S.over=1;if(w){ST.w[S.df]++;if(!ST.b[S.df]||S.t<ST.b[S.df])ST.b[S.df]=S.t}save();
 dlg(w?t('win'):t('lose'),w?(PF.tm?t('time',fmt(S.t)):'')+t('errs',3-S.lives):t('over'),(w?[]:[[t('ans'),()=>{S.cur=S.sol.slice();render()}]]).concat([[t('home'),()=>home(1),1]]))}
$('#er').onclick=()=>{if(S.over||S.sel<0||S.cur[S.sel])return;snap();S.notes[S.sel]=0;render();save()};

 snap();S.hints--;S.cur[i]=S.sol[i];S.notes[i]=0;peers(i,S.sol[i]);render();popCell(i);save();if(done())end(1)};

(function(){const sh=$('#sheet'),bx=sh.querySelector('.box');let y0=0,ly=0,lt=0,vy=0,y=0,drag=0;
 bx.addEventListener('touchstart',e=>{if(e.touches.length!=1)return;y0=ly=e.touches[0].clientY;lt=e.timeStamp;vy=0;y=0;drag=0},{passive:true});
