<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku Collection</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e2678">
<style>

:root{--bg:#eef3fa;--card:#fff;--fg:#000;--sec:#8e8e93;--line:#d1d1d6;--thick:#1c1c1e;--box:rgba(60,60,67,.4);--lab:#b23c85;--cage:#aeaeb2;--dlg:rgba(246,246,248,.76);--fill:rgba(120,120,128,.14);
 --acc:#1776c7;--rgb:23,118,199;--heart:#e859a9;--onacc:#fff;
 --rl:34px;--rm:26px;--rs:16px;--rsh:44px;--rb:999px;--rt:50%;--bd:none;--blur:36px;--sh:0 4px 16px rgba(0,0,0,.08);--dsh:0 28px 60px rgba(0,0,0,.2);
 --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;--fn:var(--ff);
 --pad:16px;--ctl:48px;--nav:44px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/22px var(--ff);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.scr{display:none;width:var(--w);--w:min(calc(100vw - 2*var(--pad)),460px);padding-bottom:32px}
.scr.on{display:block}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px;stroke-width:2.4;color:var(--sec)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px}
.nav>:first-child{justify-self:start}.nav>:last-child{justify-self:end}
.nav b{font-size:17px;font-weight:600}
.pill{height:var(--nav);background:var(--card);border:var(--bd);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.pill{padding:0 18px;border-radius:var(--rb);font:17px/22px var(--fn);font-variant-numeric:tabular-nums}
.hit{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--acc)}
h1{font-size:34px;line-height:41px;font-weight:700;margin:8px 0}
.sub{color:var(--sec);font-size:15px;line-height:20px;margin:0 0 28px}
.cap{color:var(--sec);font-size:13px;line-height:18px;padding:0 var(--pad) 8px}
.grp{background:var(--card);border:var(--bd);border-radius:var(--rm);overflow:hidden;margin-bottom:28px}
.row{display:flex;width:100%;height:var(--ctl);align-items:center;justify-content:space-between;padding:0 var(--pad);text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:var(--pad);right:0;border-top:.5px solid var(--line)}
.row small{color:var(--sec);font-size:15px;display:flex;align-items:center;gap:6px}
.row.acc{color:var(--acc)}
.foot{color:var(--sec);font-size:13px;line-height:18px;padding:0 var(--pad)}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.ttl h1{margin:0}
#hearts{display:flex;gap:6px}
#hearts svg{width:20px;height:20px;fill:var(--heart);stroke:none}
#hearts svg.off{opacity:.22}
#gw{position:relative;background:var(--card);border:1.5px solid var(--box);border-radius:0;overflow:hidden}
#grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:100%;aspect-ratio:1;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.c{display:flex;align-items:center;justify-content:center;font:calc(var(--g)/9*.56)/1 var(--fn);color:var(--acc);position:relative;cursor:pointer;overflow:hidden;min-width:0}
.c.g{color:var(--fg);font-weight:600}
.c.p{background:rgba(120,120,128,.11)}.c.s{background:rgba(var(--rgb),.14)}.c.sel{background:rgba(var(--rgb),.28)}
.c.bad{animation:sh .4s;color:#ff3b30}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sm{position:absolute;top:calc(var(--g)/9*.11);left:calc(var(--g)/9*.13);font:500 calc(var(--g)/9*.17)/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.3px;color:var(--lab);pointer-events:none}
.nt{position:absolute;inset:24%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font:calc(var(--g)/9*.18) var(--fn);color:var(--sec)}
.nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.tools{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 16px}
.tb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:14px;color:var(--sec);position:relative}
.tb em{font-style:normal}
.tb .ci .i{width:24px;height:24px;stroke-width:1.7}
.tb .ci{width:var(--ctl);height:var(--ctl);border-radius:var(--rt);background:var(--card);border:var(--bd);box-shadow:var(--sh);color:var(--acc);display:flex;align-items:center;justify-content:center}
.tb.on .ci{background:var(--acc);color:var(--onacc)}
.badge{position:absolute;top:-2px;left:calc(50% + 10px);background:var(--acc);color:var(--onacc);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.pad button{background:var(--card);border:var(--bd);border-radius:var(--rs);height:var(--ctl);font:24px/26px var(--fn);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc)}
.pad small{font:10px/11px var(--ff);color:var(--sec)}
.pad button:disabled{opacity:.25}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:9}
.mask.on{display:flex;animation:fd .2s}
@keyframes fd{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#ov{align-items:center;justify-content:center}
#ov .box{background:var(--dlg);border:var(--bd);border-radius:var(--rl);padding:20px 14px 14px;width:min(292px,75vw);box-shadow:var(--dsh);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);backdrop-filter:blur(var(--blur)) saturate(1.5);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
#ov h2{margin:0 14px 4px;font-size:17px;line-height:22px;font-weight:600}
#ov p{margin:0 14px 24px;font-size:17px;line-height:22px;color:var(--sec)}
.act{display:flex;gap:7px}
.act button{flex:1;height:44px;border-radius:var(--rb);background:var(--fill)}
.act button.b{background:var(--acc);color:var(--onacc);font-weight:600}
#sheet{align-items:flex-end;justify-content:center}
#sheet .box{background:var(--bg);width:min(100vw,500px);max-height:90vh;overflow:auto;border-radius:var(--rsh) var(--rsh) 0 0;padding:8px var(--pad) calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.gb{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto}
.stl,.pal{display:grid;gap:10px;margin-bottom:28px}
.stl{grid-template-columns:repeat(2,1fr)}.pal{grid-template-columns:repeat(3,1fr)}
.stb,.pal button{background:var(--card);border:var(--bd);border-radius:var(--rm);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;line-height:16px;outline:2px solid transparent;outline-offset:-2px}
.stb b{font-size:15px;font-weight:600}.stb small{color:var(--sec);font-size:12px}
.stb.on,.pal button.on{outline-color:var(--acc)}
.pv{width:100%;height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.pv i{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font:600 20px/1 serif;font-style:normal}
.pal button{padding:14px 0 12px;gap:10px}
.dots{display:flex}.dots i{width:14px;height:14px;border-radius:50%;margin-left:-3px;border:1.5px solid var(--card)}.dots i:first-child{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:var(--rb);padding:3px;height:var(--nav);margin-bottom:28px}
.seg button{border-radius:var(--rb);font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
#game .nav{margin-bottom:10px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
textarea{display:block;width:100%;height:84px;font:12px/16px ui-monospace,Menlo,monospace;color:var(--fg);background:var(--card);border:var(--bd);border-radius:var(--rm);padding:12px var(--pad);resize:none;margin-bottom:12px;outline:none}
#msg{color:var(--sec);font-size:13px;line-height:18px;padding:0 var(--pad);margin:-4px 0 14px;min-height:18px}

:root{--spring:cubic-bezier(.2,.9,.3,1.12)}
@supports (animation-timing-function:linear(0,1)){:root{--spring:linear(0, 0.0423, 0.1455, 0.2804, 0.4253, 0.5655, 0.6914, 0.7981, 0.8837, 0.9489, 0.9956, 1.0264, 1.0445, 1.0528, 1.0541, 1.0506, 1.0444, 1.0368, 1.0289, 1.0215, 1.015, 1.0095, 1.0052, 1.0019, 0.9997, 0.9982, 0.9974, 0.9971, 0.9971, 0.9973, 0.9977, 0.9981, 0.9985, 0.9989, 0.9993, 0.9996, 0.9998, 0.9999, 1, 1.0001, 1.0001)}}
body{position:relative;min-height:100vh;overflow-x:hidden}
.scr{display:none;flex:none;width:100%;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));--w:min(calc(100vw - 2*var(--pad)),460px);padding:0 calc((100% - var(--w))/2) 32px;background:var(--bg)}
.scr.on{display:block}
.scr.tr{position:absolute;top:0;left:0;right:0;bottom:0;width:auto}
button{transition:transform .5s var(--spring),background-color .2s,opacity .2s}
.pill:active,.act button:active,.sw:active{transform:scale(.94);transition-duration:.1s}
.pad button:active{transform:scale(.9);transition-duration:.1s}
.row{transition:background-color .3s}.row:active{background:var(--fill);transition-duration:0s}
.tb .ci{transition:transform .5s var(--spring),background-color .25s,color .25s}
.tb:active .ci{transform:scale(.88);transition-duration:.1s}
.c{transition:background-color .18s}
.sw{transition:background-color .25s}.sw::after{transition:transform .5s var(--spring)}
.mask.on{display:flex;animation:fd .25s ease both}
.mask.out{animation:fo .26s ease both}
@keyframes fd{from{opacity:0}}
@keyframes fo{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(1.1)}}
@keyframes pout{to{opacity:0;transform:scale(.95)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
#ov .box{animation:pop .5s var(--spring) both}
#ov.out .box{animation:pout .24s ease both}
#sheet .box{animation:up .55s var(--spring) both;overscroll-behavior:contain}
#sheet.out .box{animation:down .3s cubic-bezier(.32,.72,0,1) both}
.seg{position:relative}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:var(--rb);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .5s var(--spring)}
.seg button{position:relative;z-index:1}
.seg button.on{background:none;box-shadow:none;font-weight:600}
.pal em{font-style:normal}
.pal button{transition:outline-color .25s,transform .5s var(--spring)}
.pal button:active{transform:scale(.96);transition-duration:.1s}
.c .pp{animation:dpop .55s var(--spring)}
@keyframes dpop{from{transform:scale(.35);opacity:.2}}
#hearts svg{transition:opacity .3s}
#hearts svg.lose{animation:hl .55s}
@keyframes hl{0%{opacity:1;transform:scale(1)}35%{opacity:1;transform:scale(1.45) rotate(-10deg)}70%{transform:scale(.8) rotate(6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== 合集改版 ===== */
@supports (min-height:100dvh){body{min-height:100dvh}.scr{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.sub{min-height:40px}
#mseg{margin:0 0 14px}
.bb{display:flex;align-items:center;height:44px;margin-left:-6px;padding:0 10px 0 2px;color:var(--acc);font-size:17px;line-height:22px;border-radius:12px}
.bb .i{width:20px;height:20px;stroke-width:2.4;margin-right:1px}
.bb:active{opacity:.35;transition-duration:.05s}
#game{--m:0px;--g:calc(var(--w) - 2*var(--m))}
#game[data-mode=sand]{--m:20px}
#game.on{display:flex;flex-direction:column}
#game .nav,#gwrap,#game .tools,#game .pad{flex:none}
.sp{display:block;min-height:0}
#gwrap{position:relative;padding:var(--m)}
#clues{position:absolute;inset:0;pointer-events:none}
.cl{position:absolute;display:flex;align-items:center;justify-content:center;font:500 calc(var(--g)/9*.28)/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--lab);opacity:.85;transition:opacity .3s;letter-spacing:-.2px}
.cl.t{top:0;height:var(--m);transform:translateX(-50%)}
.cl.b{bottom:0;height:var(--m);transform:translateX(-50%)}
.cl.l{left:0;width:var(--m);transform:translateY(-50%)}
.cl.r{right:0;width:var(--m);transform:translateY(-50%)}
.cl.ok{opacity:.22}
#hseg{margin-bottom:28px;transition:opacity .25s}
#hseg.dis{opacity:.4;pointer-events:none}

#home h1{margin:14px 0 28px;letter-spacing:-.5px}
.scr.tr{will-change:transform}
#ld{position:fixed;inset:0;z-index:30;background:var(--bg,#eef3fa);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:8vh;opacity:0;pointer-events:none;transition:opacity .3s}
#ld.on{opacity:1;pointer-events:auto}
.ldg{display:grid;grid-template-columns:repeat(3,15px);gap:4px}
.ldg i{position:relative;width:15px;height:15px;border-radius:4px;background:rgba(var(--rgb,23,118,199),.16);will-change:transform;animation:ldw .8s ease-in-out infinite;animation-delay:calc(var(--i)*.07s)}
.ldg i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--hl,var(--acc,#1776c7));opacity:0;will-change:opacity;animation:ldh .8s ease-in-out infinite;animation-delay:calc(var(--i)*.07s)}
.ldg i:nth-child(5){--hl:var(--heart,#e859a9)}
@keyframes ldw{0%,100%{transform:scale(.9)}14%{transform:scale(1.03)}55%{transform:scale(.9)}}
@keyframes ldh{0%,100%{opacity:0}14%{opacity:1}58%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ldg i,.ldg i::after{animation:none}.ldg i::after{opacity:.5}}

/* ===== 设置整理 / 高亮 / 虚影 ===== */
.row .seg{margin:0;height:34px;flex:none}
.row .seg button{font-size:14px}
#seg{margin-bottom:12px}
#pal{margin-bottom:28px}
#recs small{font-size:13px;font-variant-numeric:tabular-nums}
#ta{display:none}#ta.show{display:block}
.gh{opacity:.28}
.ag{opacity:.5;transition:opacity .25s}
.ag circle,.ag path{transition:stroke-width .25s}
#gl.has .ag{opacity:.18}
#gl.has .ag.on{opacity:1}
#gl .ag.on circle,#gl .ag.on path{stroke-width:3.6}
.cl{opacity:.7}
.cl.hl{opacity:1;font-weight:700}
.cl.ok{opacity:.22}
.cl.hl.ok{opacity:.5}
#hseg,#lseg{margin:0}
#sheet.on,#sheet.out,#sheet .box,#sheet.out .box{animation:none!important}

/* ===== 打印 ===== */
#sheet #pp{display:none}#sheet.pr #pp{display:block}#sheet.pr .box>:not(.gb):not(#pp){display:none}
.stp{display:flex;align-items:center;gap:2px}
.stp button{width:34px;height:34px;border-radius:50%;background:var(--fill);font-size:20px;line-height:1;color:var(--acc)}
.stp button:disabled{opacity:.3}
.stp b{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
#prg{width:100%;height:50px;background:var(--acc);color:var(--onacc);font-weight:600;border-radius:var(--rb)}
#prg:disabled{opacity:.6}

</style>

<script id="core">
const bit=d=>1<<d;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mask(g,i){const r=i/9|0,c=i%9,br=r-r%3,bc=c-c%3;let m=0;for(let k=0;k<9;k++)m|=bit(g[r*9+k])|bit(g[k*9+c])|bit(g[(br+(k/3|0))*9+bc+k%3]);return m}
const lo=m=>{for(let d=1;d<10;d++)if(!(m&bit(d)))return d;return 10},hi=m=>{for(let d=9;d>0;d--)if(!(m&bit(d)))return d;return 0};
/* 三明治：digits 2..8 的子集和表 */
const SF=new Uint8Array(128*8*36);
(function(){for(let s=0;s<128;s++){let pc=0,sum=0;for(let k=0;k<7;k++)if(s>>k&1){pc++;sum+=k+2}for(let m=0;m<128;m++)if((m&s)==s)SF[(m*8+pc)*36+sum]=1}})();
function lineOK(v,c){
 if(c==null)return true;
 let pl=0,p1=-1,p9=-1;for(let k=0;k<9;k++){const x=v[k];if(x){pl|=bit(x);if(x==1)p1=k;else if(x==9)p9=k}}
 let av=0;for(let d=2;d<9;d++)if(!(pl&bit(d)))av|=1<<(d-2);
 for(let a=0;a<9;a++){if(p1>=0?a!=p1:v[a])continue;
  for(let b=0;b<9;b++){if(b==a||(p9>=0?b!=p9:v[b]))continue;
   const l=a<b?a:b,h=a<b?b:a;let s=0,u=0;for(let k=l+1;k<h;k++){if(v[k])s+=v[k];else u++}
   const n=c-s;if(n<0)continue;if(u==0){if(n==0)return true;continue}if(n<36&&SF[(av*8+u)*36+n])return true}}
 return false}
function arrowOK(g,W,k){const A=W.ar[k];let cl,ch,sl=0,sh=0;
 const f=x=>{if(g[x])return[g[x],g[x]];const m=mask(g,x);return[lo(m),hi(m)]};
 [cl,ch]=f(A.c);if(cl>ch)return false;

  cand(g,W,i){let m=mask(g,i);const k=W.cg[i],T=W.sums[k];let s=0,r=0;for(const j of W.cages[k]){if(g[j]){s+=g[j];m|=bit(g[j])}else r++}

  ok(g,W,i){const k=W.ai[i];return k<0||arrowOK(g,W,k)}},

  ok(g,W,i){const r=i/9|0,c=i%9;if(!lineOK(g.slice(r*9,r*9+9),W.rc[r]))return false;const v=[];for(let k=0;k<9;k++)v.push(g[k*9+c]);return lineOK(v,W.cc[c])}}

/* 交付 PDF：系统分享面板 / 另存为对话框，最后才退回普通下载 */
async function deliver(blob,name){
 const f=new File([blob],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'ok'}}
 catch(e){if(e&&e.name==='AbortError')return 'cancel';if(e&&e.name==='NotAllowedError')return 'need'}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6e4);return 'ok'}

 catch(e){}
